<style id="ta-loader-css">
  /* Techartist loader (toolkit/brand), Bounce look since 2026-11-18: sunshine, the logo's ball bouncing on its i, the
     word, the piece's title, a bar with a live percentage, Enter (and Enter without sound) for pieces with sound, and the
     ©. Critical CSS: inline it so the very first paint is already branded. Same markup hooks as before (loader.js). */
  #ta-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; background: #FFD84A; color: #121225;
    font: 600 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity 0.6s ease 0.1s, visibility 0s 0.75s; }
  #ta-loader.ta-done { opacity: 0; visibility: hidden; pointer-events: none; }
  #ta-loader .ta-in { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 24px; }
  #ta-loader .ta-bnc { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #ta-loader .ta-bnc-mk { position: relative; width: 60px; height: 104px; }
  #ta-loader .ta-bnc-mk i { position: absolute; left: 20px; bottom: 0; width: 20px; height: 44px; border-radius: 10px; background: #2B2BD9; }
  #ta-loader .ta-bnc-mk b { position: absolute; left: 15px; bottom: 50px; width: 30px; height: 30px; border-radius: 50%; background: #FF6A12; transform-origin: 50% 100%; animation: ta-bnc-b 0.9s infinite; }
  @keyframes ta-bnc-b { 0%, 100% { translate: 0 -48px; scale: 1; animation-timing-function: cubic-bezier(.45, 0, 1, .6); } 46% { translate: 0 0; scale: 1; animation-timing-function: linear; } 52% { translate: 0 1px; scale: 1.28 0.72; animation-timing-function: linear; } 58% { translate: 0 0; scale: 1; animation-timing-function: cubic-bezier(0, .45, .6, 1); } }
  #ta-loader .ta-bnc svg { display: block; width: clamp(150px, 24vmin, 210px); height: auto; }
  #ta-loader .ta-title { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #121225; }
  #ta-loader .ta-bar { width: clamp(150px, 22vmin, 190px); height: 10px; border-radius: 9px; border: 2.5px solid #121225; background: #FFFFFF; overflow: hidden; box-sizing: content-box; }
  #ta-loader .ta-bar i { display: block; height: 100%; width: calc(var(--ta-p, 0) * 100%); min-width: 14%; background: #2B2BD9; transition: width 0.35s ease; position: relative; overflow: hidden; }
  #ta-loader .ta-bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0)); transform: translateX(-100%); animation: ta-shimmer 1.1s ease-in-out infinite; }
  #ta-loader.ta-wait .ta-bar i { animation: ta-run 1.3s ease-in-out infinite; }
  #ta-loader .ta-pct { margin-top: -4px; font: 800 14px/1 system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; color: #121225; }
  #ta-loader.ta-ready .ta-pct { display: none; }
  #ta-loader .ta-msg { max-width: 440px; text-align: center; color: #121225; min-height: 1em; }
  #ta-loader .ta-copy { position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center; font-size: 13px; font-weight: 700; color: #121225; }
  @keyframes ta-shimmer { to { transform: translateX(100%); } }
  @keyframes ta-run { 0% { transform: translateX(-100%); } 100% { transform: translateX(700%); } }
  @keyframes ta-fade { from { opacity: 0; } to { opacity: 1; } }
  /* Enter gate: the loader finishes on Enter (the click unlocks sound), with a quiet way in without sound */
  #ta-loader .ta-go { display: none; flex-direction: column; align-items: center; gap: 12px; margin-top: 4px; }
  #ta-loader.ta-ready .ta-go { display: flex; animation: ta-fade 0.4s ease both; }
  #ta-loader.ta-ready .ta-bar { display: none; }
  #ta-loader .ta-enter { font: 800 15px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #FFD84A; cursor: pointer;
    padding: 13px 30px 14px; border-radius: 999px; border: 3px solid #121225; background: #121225; box-shadow: 0 5px 0 rgba(18, 18, 37, 0.35); }
  #ta-loader .ta-enter:hover, #ta-loader .ta-enter:focus-visible { background: #26264A; outline: 3px solid #2B2BD9; outline-offset: 3px; }
  #ta-loader .ta-enter:active { transform: translateY(3px); box-shadow: none; }
  #ta-loader .ta-quiet { font: 700 13px/1.2 system-ui, -apple-system, sans-serif; color: #121225; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { #ta-loader * { animation: none !important; } #ta-loader .ta-bnc-mk b { translate: 0 -10px; } }
</style>

<style>
  :root { --ink: #f3e7d6; --dim: rgba(243, 231, 214, 0.55); --gold: #ffb45a; --line: rgba(255, 190, 120, 0.22); --pane: rgba(14, 12, 14, 0.72); }
  html, body { margin: 0; height: 100%; background: #03050a; overflow: hidden; font: 500 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }
  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: var(--pane); border: 1px solid var(--line); border-radius: 999px; opacity: 0; transition: opacity .5s; }
  body.ready #bar { opacity: 1; }
  #bar button { all: unset; box-sizing: border-box; cursor: pointer; height: 34px; min-width: 34px; padding: 0 10px; border-radius: 999px; display: grid; place-items: center;
    color: var(--ink); font: inherit; letter-spacing: .02em; }
  #bar button:hover { background: rgba(255, 180, 90, 0.14); }
  #bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  #bar svg { width: 16px; height: 16px; fill: currentColor; display: block; }
  #play[data-on="1"] .i-play, #play[data-on="0"] .i-pause { display: none; }
  #slow[data-on="1"] { background: var(--gold); color: #1a0f05; }
  #bar #sound { display: inline-flex; align-items: center; gap: 6px; }
  #sound[data-on="1"] .i-off, #sound[data-on="0"] .i-on, #sound[data-on="1"] .lbl { display: none; }
  #sound[data-on="1"] { color: var(--gold); }
  @media (max-width: 520px) { #sound .lbl { display: none; } }
  #track { --p: 0; position: relative; width: min(34vw, 300px); height: 34px; margin: 0 8px 0 4px; }
  #track::before, #rail { content: ""; position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; }
  #track::before { background: rgba(255, 255, 255, 0.14); }
  #rail { overflow: hidden; }
  #fill { width: 100%; height: 100%; background: linear-gradient(90deg, #6fa8ff, #ffb45a 45%, #ff6a2a); transform-origin: 0 50%; transform: scaleX(0); }
  #ticks i { position: absolute; top: 11px; width: 2px; height: 12px; margin-left: -1px; border-radius: 1px; background: rgba(243, 231, 214, 0.3); }
  #track::after { content: ""; position: absolute; top: 10px; left: calc(var(--p) * 100% - 7px); width: 14px; height: 14px; border-radius: 50%; background: var(--ink);
    box-shadow: 0 0 0 3px rgba(255, 180, 90, 0.35); pointer-events: none; }
  #scrub { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  #track:focus-within::after { box-shadow: 0 0 0 3px var(--gold); }
  #beat { position: fixed; left: 50%; bottom: 68px; transform: translateX(-50%); display: flex; gap: 10px; align-items: baseline; padding: 5px 12px; border-radius: 999px;
    background: var(--pane); border: 1px solid var(--line); white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #beat b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--gold); min-width: 3.4em; text-align: right; }
  body.scrubbing #beat, body:has(#track:hover) #beat, body:has(#scrub:focus-visible) #beat { opacity: 1; }
  #bar #layers { display: inline-flex; align-items: center; gap: 6px; }
  #bar #layers[data-on="1"], #bar #slow[data-on="1"] { background: var(--gold); color: #1a0f05; }
  /* the breakdown: one slim strip above the controls */
  #panel { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 2px;
    width: max-content; max-width: calc(100vw - 16px); box-sizing: border-box; padding: 4px 5px; border-radius: 17px; background: var(--pane); border: 1px solid var(--line); }
  #stack { display: contents; }
  #panel button { all: unset; box-sizing: border-box; cursor: pointer; font: inherit; font-size: 12px; color: var(--ink); height: 26px; padding: 0 9px 0 7px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #panel button:hover { background: rgba(255, 180, 90, 0.14); }
  #panel button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  #panel button[aria-pressed="true"] { background: rgba(255, 180, 90, 0.24); font-weight: 600; }
  #panel svg { width: 11px; height: 11px; fill: currentColor; display: block; }
  .sw { flex: none; width: 10px; height: 10px; border-radius: 3px; background: #888; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
  .sw-all { background: conic-gradient(#8fb8ff, #ffc76a, #ff6a2a, #ffe9a8, #8fb8ff); }
  .sw-seal { background: linear-gradient(135deg, #a9c9ff, #ffd27a); }
  .sw-crescents { background: #ff8a2a; border-radius: 50% 50% 50% 2px; }
  .sw-fire { background: radial-gradient(circle at 50% 70%, #fff0b8, #ff7a1e 55%, #7a1206); }
  .sw-bolt { background: linear-gradient(90deg, #7a1206, #ffb13b 60%, #fff2c4); }
  .sw-light { background: linear-gradient(135deg, #f6ead8 50%, #2a2622 50%); }
  .raws { display: inline-flex; gap: 1px; padding: 0 3px; margin: 0 2px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  #panel .raws button { padding: 0 7px; font-size: 11.5px; color: var(--dim); }
  #panel .raws button[aria-pressed="true"] { background: var(--ink); color: #1a0f05; }
  #panel #tour { margin-left: 3px; padding: 0 9px 0 8px; border: 1px solid var(--line); }
  #panel #tour .i-stop, #panel #tour[aria-pressed="true"] .i-go { display: none; }
  #panel #tour[aria-pressed="true"] { background: var(--gold); color: #1a0f05; }
  #panel #tour[aria-pressed="true"] .i-stop { display: block; }
  #panel #about { padding: 0; width: 26px; justify-content: center; font-weight: 700; font-family: ui-serif, Georgia, serif; font-style: italic; color: var(--dim); }
  #panel #about[aria-expanded="true"] { background: var(--ink); color: #1a0f05; }
  #how { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); box-sizing: border-box; width: min(380px, calc(100vw - 16px)); margin: 0; padding: 9px 13px;
    border-radius: 12px; background: var(--pane); border: 1px solid var(--line); font-size: 12px; line-height: 1.45; color: var(--ink); }
  body.breakdown #beat { bottom: 116px; }
  body.about #beat { display: none; }
  @media (max-width: 640px) {
    #bar { bottom: 10px; gap: 2px; }
    #track { width: min(30vw, 150px); }
    #layers .lbl, #tour .lbl { display: none; }
    #panel { bottom: 64px; }
    #panel #tour { padding: 0 8px; }
    #beat { bottom: 60px; }
    body.breakdown #beat { bottom: 136px; }
  }
  /* the © stays on screen: people screen-record live pieces */
  #copy { position: fixed; right: 12px; top: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(14, 12, 14, 0.58); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: rgba(243, 231, 214, 0.9); pointer-events: none; }
</style>
</head>
